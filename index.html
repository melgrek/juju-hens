/* the copper frame */
.frame{position:fixed;z-index:1;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;right:14px;
  border:1px solid var(--copper);}
.frame::after{content:"";position:absolute;inset:6px;border:1px solid var(--copper-dim)}
.frame svg{position:absolute;width:26px;height:26px;fill:var(--copper);transform:translate(-50%,-50%)}
.frame .tl{left:0;top:0}.frame .tr{left:100%;top:0}.frame .bl{left:0;top:100%}.frame .br{left:100%;top:100%}
.frame .tm{left:50%;top:0;width:30px;height:30px}.frame .bm{left:50%;top:100%;width:30px;height:30px}

/* app shell */
.app{position:relative;z-index:2;height:100%;box-sizing:border-box;
  display:grid;grid-template-rows:auto 1fr auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 36px) calc(env(safe-area-inset-bottom,0px) + 34px);
  padding-inline:clamp(30px,5vw,56px);}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
.eyebrow{font-family:var(--body);font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--copper)}
.score{display:flex;align-items:baseline;gap:.5em;font-variant-numeric:tabular-nums;color:var(--sage);font-size:.85rem;letter-spacing:.08em}
.score b{font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--copper-soft);letter-spacing:0;line-height:1}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{appearance:none;border:0;background:none;color:var(--sage);width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
.icon-btn:focus-visible,.btn:focus-visible,.dot:focus-visible,.chip:focus-visible{outline:2px solid var(--copper-soft);outline-offset:3px}

/* stage */
.stage{min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding-block:12px;touch-action:pan-y}

.screen{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,26px);width:100%;max-width:min(100%,900px);animation:rise .5s ease both}
@keyframes rise{from{opacity:.0001;transform:translateY(10px)}to{opacity:1;transform:none}}

.rule{display:flex;align-items:center;gap:12px;width:min(320px,70%);color:var(--copper)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.8}
.rule svg{width:18px;height:18px;fill:currentColor;flex:none}

h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;color:var(--copper-soft);line-height:.95;
  text-shadow:0 2px 0 rgba(0,0,0,.25)}
h1{font-size:clamp(3rem,10.5vw,7rem)}
h2{font-size:clamp(2.4rem,8vw,5.2rem)}
.lede{font-style:italic;font-size:clamp(1.15rem,2.6vw,1.6rem);color:var(--ivory);margin:0;max-width:32ch;text-wrap:balance;line-height:1.35}
.small{font-size:clamp(.95rem,1.8vw,1.1rem);color:var(--sage);margin:0;max-width:40ch;line-height:1.5;text-wrap:balance}
.date{font-family:var(--display);color:var(--copper);font-size:clamp(1.2rem,2.6vw,1.6rem);letter-spacing:.12em}

.q-num{font-family:var(--display);color:var(--copper);font-size:clamp(1.3rem,3vw,1.8rem)}
.question{font-size:clamp(1.8rem,5vw + .4rem,3.6rem);line-height:1.18;margin:0;max-width:22ch;text-wrap:balance;font-weight:500}

.answer{position:relative;width:min(100%,640px);min-height:clamp(120px,19vh,190px);display:grid;place-items:center;
  border:1px solid var(--copper-dim);padding:22px 24px;box-sizing:border-box;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(180deg,rgba(18,35,31,.55),rgba(18,35,31,.3))}
.answer::before,.answer::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--copper);}
.answer::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.answer::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.answer .label{font-size:.9rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sage);margin-bottom:10px}
.answer .sealed{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--sage);font-style:italic;font-size:1.15rem}
.answer .sealed svg{width:34px;height:34px;fill:var(--copper);animation:glint 2.8s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.55;transform:scale(.9) rotate(0)}50%{opacity:1;transform:scale(1.05) rotate(45deg)}}
.answer .kyle{font-family:var(--display);color:var(--copper-soft);font-size:clamp(2.6rem,min(12vw,8vh),7.5rem);line-height:1;text-wrap:balance;animation:rise .55s ease both}
.answer .kyle.long{font-family:var(--body);font-style:italic;font-size:clamp(1.7rem,min(5.8vw,4vh),3rem);line-height:1.3;color:var(--ivory)}
.answer.open{cursor:default;border-color:var(--copper)}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,640px)}
.chip{font-family:var(--display);font-size:clamp(1.3rem,3.4vw,2rem);color:var(--ivory);padding:14px 6px 12px;border:1px solid var(--copper-dim);
  transition:all .45s ease;background:rgba(18,35,31,.35)}
.chips.done .chip{opacity:.28}
.chips.done .chip.pick{opacity:1;background:var(--copper);color:var(--ground-deep);border-color:var(--copper);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* guests vs Julienne */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,640px)}
.team{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--copper-dim);background:rgba(18,35,31,.4);text-align:left;min-width:0;transition:border-color .3s,opacity .3s}
.team.got{border-color:var(--copper);background:rgba(215,154,130,.12)}
.team.miss{opacity:.6}
.team-name{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--copper)}
.said{font:inherit;font-size:1.25rem;color:var(--ivory);background:transparent;border:0;border-bottom:1px solid var(--copper-dim);padding:8px 2px;width:100%;box-sizing:border-box;border-radius:0;-webkit-user-select:text;user-select:text;outline:none}
.said:focus{border-bottom-color:var(--copper-soft)}
.said::placeholder{color:var(--sage);opacity:.6;font-style:italic}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pickbtn{appearance:none;font-family:var(--display);font-size:1.25rem;color:var(--ivory);background:transparent;border:1px solid var(--copper-dim);min-height:46px;cursor:pointer;touch-action:manipulation;padding:6px 4px 4px}
.pickbtn.pick{background:var(--ivory);color:var(--ground-deep);border-color:var(--ivory)}
.pickbtn.right{border-color:var(--copper);box-shadow:inset 0 0 0 1px var(--copper)}
.pickbtn.pick.right{background:var(--copper);border-color:var(--copper)}
.marks{display:flex;gap:6px}
.mk{appearance:none;font:inherit;flex:1;min-height:44px;border:1px solid var(--copper);background:transparent;color:var(--copper-soft);cursor:pointer;touch-action:manipulation;font-size:1rem}
.mk.on{background:var(--copper);color:var(--ground-deep)}
.mk.miss{border-color:var(--sage);color:var(--sage)}
.mk.miss.on{background:var(--sage);color:var(--ground-deep)}
.verdict-tag{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);min-height:20px}
.verdict-tag.got{color:var(--copper-soft)}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(100%,560px)}
.versus div{display:flex;flex-direction:column;align-items:center;gap:6px}
.versus span{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
.versus b{font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,11vw,6rem);line-height:.9;color:var(--copper-soft);font-variant-numeric:tabular-nums}
.versus b small{font-size:.35em;color:var(--sage)}
.versus.big .win b{color:var(--copper)}
.versus.big div:not(.win) b{color:var(--ivory)}
.breakdown em{font-style:italic;font-size:.8rem;color:var(--sage)}
#where{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .who{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.score .sep{color:var(--copper-dim)}
.qside{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,26px);width:100%}
.qscreen .answer{min-height:clamp(150px,26vh,320px)}
@media (max-width:480px){.teams{grid-template-columns:1fr}}
/* sideways iPad: question and answers on the left, Kyle's answer gets the whole right half */
@media (orientation:landscape) and (min-width:900px){
  .qscreen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:clamp(20px,3vw,40px);max-width:1200px}
  .qscreen .qside{justify-content:center}
  .qscreen .question{font-size:clamp(1.6rem,3vw,2.8rem)}
  .qscreen .answer{width:100%;min-height:0;height:100%}
  .qscreen .answer .kyle{font-size:clamp(2.8rem,min(7.4vw,13vh),8rem)}
  .qscreen .answer .kyle.long{font-size:clamp(1.6rem,min(3.4vw,6vh),3rem)}
}

/* footer */
footer{display:flex;flex-direction:column;align-items:center;gap:14px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:24px}
.dot{appearance:none;border:0;background:none;padding:0;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.dot i{display:block;width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--copper-dim);transition:all .3s}
.dot.seen i{background:var(--copper-dim);border-color:transparent}
.dot.got i{background:var(--copper);border-color:var(--copper)}
.dot.now i{width:10px;height:10px;border-color:var(--copper-soft);box-shadow:0 0 0 3px rgba(215,154,130,.18)}
.controls{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;width:min(100%,640px)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;font:inherit;cursor:pointer;touch-action:manipulation;min-height:54px;padding:0 26px;
  border:1px solid var(--copper);background:transparent;color:var(--copper-soft);font-size:1.1rem;letter-spacing:.06em;transition:background .2s,color .2s}
.btn.solid{background:var(--copper);color:var(--ground-deep);font-weight:600}
.btn.on{background:var(--copper);color:var(--ground-deep)}
.btn.miss.on{background:var(--sage);border-color:var(--sage);color:var(--ground-deep)}
.btn.miss{border-color:var(--sage);color:var(--sage)}
.btn:active{transform:translateY(1px)}
.arrow{width:56px;height:56px;border-radius:50%;border:1px solid var(--copper-dim);background:none;color:var(--copper);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.arrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.arrow:disabled{opacity:.2;cursor:default}

/* results */
.big-score{font-family:var(--display);font-size:clamp(5rem,18vw,10rem);color:var(--copper-soft);line-height:.85;font-variant-numeric:tabular-nums}
.big-score small{font-size:.32em;color:var(--sage)}
.breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(100%,600px)}
.breakdown div{border-top:1px solid var(--copper-dim);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.breakdown span{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
.breakdown b{font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--ivory);font-variant-numeric:tabular-nums}

/* confirm sheet */
.sheet{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--veil);padding:24px}
.sheet .card{background:var(--ground);border:1px solid var(--copper);padding:28px 26px;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;color:var(--copper-soft)}
.sheet p{margin:0;color:var(--sage);line-height:1.5}
.nav-list{display:flex;flex-direction:column;gap:10px}
.nav-list .btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.nav-list .btn span{font-size:.85rem;color:var(--sage);letter-spacing:.04em}
.nav-list .btn.here{background:var(--copper);color:var(--ground-deep)}
.nav-list .btn.here span{color:var(--ground-deep)}

@media (max-height:640px) and (orientation:landscape){
  .app{padding-block:26px 24px}
  .answer{min-height:96px;padding:14px}
  footer{gap:6px}
}
@media (max-width:480px){
  .chips{grid-template-columns:repeat(2,1fr)}
  .breakdown b{font-size:1.4rem}
  .btn{padding:0 18px}
  .frame .tm,.frame .bm{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 0C12.6 7.6 16.4 11.4 24 12 16.4 12.6 12.6 16.4 12 24 11.4 16.4 7.6 12.6 0 12 7.6 11.4 11.4 7.6 12 0Z"/></symbol>
</svg>

<div class="ground"></div>
<div class="frame" aria-hidden="true">
  <svg class="tl"><use href="#star"/></svg><svg class="tr"><use href="#star"/></svg>
  <svg class="bl"><use href="#star"/></svg><svg class="br"><use href="#star"/></svg>
  <svg class="tm"><use href="#star"/></svg><svg class="bm"><use href="#star"/></svg>
</div>

<div class="app">
  <header>
    <div class="eyebrow" id="where">Julienne's Bridal Shower</div>
    <div class="tools">
      <div class="score" id="score" hidden><span class="who">Guests</span><b id="scoreG">0</b><span class="sep">·</span><span class="who">Ju</span><b id="scoreJ">0</b></div>
      <button class="icon-btn" id="fsBtn" aria-label="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="navBtn" aria-label="Jump to a round"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="icon-btn" id="resetBtn" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="arrow" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="actions" id="actions"></div>
      <button class="arrow" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </footer>
</div>

<div class="sheet" id="navSheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="navTitle">
    <h3 id="navTitle">Go to</h3>
    <p>Scores are kept. Only the start-over button clears them.</p>
    <div class="nav-list" id="navList"></div>
    <button class="btn" id="closeNav" style="border-color:var(--sage);color:var(--sage)">Close</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Start over?</h3>
    <p>This clears every answer revealed and Ju's score, and goes back to the opening card.</p>
    <div class="actions">
      <button class="btn" id="cancelReset">Keep going</button>
      <button class="btn solid" id="confirmReset">Start over</button>
    </div>
  </div>
</div>

<script>
const ROUNDS = [
  { roman:"I", name:"How Well Do You Know Kyle?", intro:"",
    qs:[
      ["What is Kyle's favourite food?","Cottage Pie"],
      ["What is Kyle's favourite drink, alcoholic or non-alcoholic?","Coffee"],
      ["Which football team does Kyle support?","Barcelona"],
      ["Who is Kyle's favourite band or artist?","Linkin Park"],
      ["How many years has Kyle worked at KPMG?","12 years"],
      ["If Kyle could see any band or artist live tomorrow, who would he choose?","Linkin Park"],
      ["What is Kyle's dream holiday destination?","New Zealand"]
    ]},
  { roman:"II", name:"Your Love Story", intro:"",
    qs:[
      ["Where did you and Kyle first meet?","Through mutual friends"],
      ["Who made the first move?","Ju"],
      ["What does Kyle consider your first proper date?","Dinner at Avenue on 24 October 2013"],
      ["Where did you go on your first holiday together?","Scotland"],
      ["What was the first concert or big event you attended together?","Coldplay"],
      ["According to Kyle, what has been your most memorable holiday or trip together?","Austria, 2022"],
      ["What is Kyle's favourite memory of the two of you together?","The proposal at Hallstatt"],
      ["What is Kyle most looking forward to doing with you once you're married?","Building a family together, lazy nights in, and continuing to travel together."]
    ]},
  { roman:"III", name:"The Quick & Dirty Round", intro:"Who did Kyle choose: Ju, Kyle, both, or neither?", choice:true,
    qs:[
      ["Who is the messiest?","Neither"],["Who is the better cook?","Both"],["Who is the loudest?","Kyle"],
      ["Who is the biggest shopaholic?","Ju"],["Who is the clean freak?","Both"],["Who takes longer to get ready?","Neither"],
      ["Who is more likely to fall asleep during a film?","Ju"],["Who is more likely to cry at a film?","Ju"],
      ["Who is the better driver?","Kyle"],["Who is more competitive?","Kyle"],["Who is more likely to plan everything in advance?","Kyle"],
      ["Who is more likely to be running late?","Neither"],["Who is more likely to organise a holiday?","Kyle"],
      ["Who is more likely to get lost on that holiday?","Ju"],["Who is more romantic?","Both"],
      ["Who is more likely to sneak snacks into the cinema?","Neither"]
    ]}
];
const CHOICES = ["Ju","Kyle","Both","Neither"];
const ORD = ["One","Two","Three"];
const TEAMS = [["g","The guests"],["j","Julienne"]];

const SLIDES = [{type:"title"}];
ROUNDS.forEach((r,ri)=>{
  SLIDES.push({type:"round",ri});
  r.qs.forEach((q,qi)=>SLIDES.push({type:"q",ri,qi,id:ri+"-"+qi,text:q[0],ans:q[1],choice:!!r.choice}));
  SLIDES.push({type:"roundEnd",ri});
});
SLIDES.push({type:"final"});
const TOTAL = SLIDES.filter(s=>s.type==="q").length;
const QBYID = Object.fromEntries(SLIDES.filter(s=>s.type==="q").map(s=>[s.id,s]));

const KEY="newly-wed-game-v2";
const fresh=()=>({i:0, revealed:{}, said:{}, mark:{}});
let S = fresh();
function load(seed){
  if(seed && typeof seed.i==="number" && seed.said){S=seed;return}
  try{const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v&&typeof v.i==="number"&&v.said) S=v;}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
const star='<svg viewBox="0 0 24 24"><use href="#star"/></svg>';
const rule='<div class="rule">'+star+'</div>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// a team's result on a question: round 3 is marked automatically from the pick; rounds 1 and 2 are marked by the host
function result(id,t){
  const q=QBYID[id]; if(!S.revealed[id]) return null;
  const m=(S.mark[id]||{})[t]; if(m) return m;
  if(q.choice){const p=(S.said[id]||{})[t]; return p? (p===q.ans?"got":"miss") : null}
  return null;
}
function score(t,ri){
  return Object.keys(QBYID).filter(id=>ri===undefined||QBYID[id].ri===ri).reduce((n,id)=>n+(result(id,t)==="got"?1:0),0);
}
function verdict(n){
  const p=n/TOTAL;
  if(p>=.9) return "First-class honours. Kyle is a fully known quantity.";
  if(p>=.7) return "Passed with distinction. A few blind spots, nothing a honeymoon can't fix.";
  if(p>=.5) return "A respectable pass. Some light revision before the vows.";
  if(p>=.25) return "A conditional pass. Kyle may have some explaining to do. Or Ju does.";
  return "A resit is required. Are we sure they've actually met?";
}

function teamCard(s,t,label){
  const open=!!S.revealed[s.id], said=(S.said[s.id]||{})[t]||"", res=result(s.id,t);
  let body;
  if(s.choice){
    body=`<div class="picks">${CHOICES.map(c=>{
      const cls=[said===c?"pick":"", open&&c===s.ans?"right":""].join(" ");
      return `<button class="pickbtn ${cls}" data-pick="${t}" data-val="${c}">${c}</button>`;}).join("")}</div>`;
  } else {
    body=`<input class="said" id="said-${t}-${s.id}" data-said="${t}" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" placeholder="Their answer" value="${esc(said)}">`;
  }
  let foot="";
  if(open){
    foot=`<div class="marks"><button class="mk ${res==="got"?"on":""}" data-mark="${t}" data-val="got">Correct</button><button class="mk miss ${res==="miss"?"on":""}" data-mark="${t}" data-val="miss">Incorrect</button></div>`;
  }
  return `<div class="team ${res||""}"><div class="team-name">${label}</div>${body}${foot}</div>`;
}

function render(){
  const s=SLIDES[S.i], st=$("stage");
  let html="", acts="";
  const where=$("where");
  if(s.type==="title"){
    where.textContent="Julienne's Bridal Shower";
    html=`<div class="screen">
      <div class="eyebrow">Julienne's Bridal Shower</div>
      <h1>The Newly Wed Game</h1>
      ${rule}
      <p class="lede">Who Knows Best?</p>
      <p class="small">The guests against the bride. Both answer, then Kyle's answers are unsealed.</p>
      <div class="date">XI · X · MMXXVI</div>
    </div>`;
    acts=`<button class="btn solid" data-act="next">Let the game begin</button>`;
  } else if(s.type==="round"){
    const r=ROUNDS[s.ri];
    where.textContent="Round "+r.roman;
    html=`<div class="screen">
      <div class="eyebrow">Round ${ORD[s.ri]}</div>
      <h2>${esc(r.name)}</h2>
      ${rule}
      ${r.intro ? `<p class="lede">${esc(r.intro)}</p>` : ""}
      <p class="small">${r.qs.length} questions</p>
    </div>`;
    acts=`<button class="btn solid" data-act="next">Start round ${r.roman}</button>`;
  } else if(s.type==="q"){
    const r=ROUNDS[s.ri], open=!!S.revealed[s.id];
    where.textContent="Round "+r.roman+" · "+r.name;
    const long=s.ans.length>34;
    const sealed=`<div class="sealed">${star}<span>Tap to reveal Kyle's answer</span></div>`;
    const reveal=`<div><div class="label">Kyle said</div><div class="kyle ${long?"long":""}">${esc(s.ans)}</div></div>`;
    html=`<div class="screen qscreen"><div class="qside">
      <div class="q-num">${s.qi+1} <span style="color:var(--sage);font-size:.7em">of ${r.qs.length}</span></div>
      <p class="question">${esc(s.text)}</p>
      <div class="teams">${TEAMS.map(([t,l])=>teamCard(s,t,l)).join("")}</div></div>
      <div class="answer ${open?"open":""}" data-act="${open?"":"reveal"}" role="button" tabindex="${open?-1:0}" aria-label="${open?"Kyle's answer":"Reveal Kyle's answer"}">${open?reveal:sealed}</div>
    </div>`;
    acts = open
      ? `<button class="btn solid" data-act="next">${S.i+1<SLIDES.length&&SLIDES[S.i+1].type==="q"?"Next question":"End of round"}</button>`
      : `<button class="btn solid" data-act="reveal">Reveal Kyle's answer</button>`;
  } else if(s.type==="roundEnd"){
    const r=ROUNDS[s.ri], last=s.ri===ROUNDS.length-1;
    where.textContent="Round "+r.roman+" complete";
    html=`<div class="screen">
      <div class="eyebrow">End of Round ${ORD[s.ri]}</div>
      <h2>${esc(r.name)}</h2>
      ${rule}
      <div class="versus">
        <div><span>The guests</span><b>${score("g",s.ri)}<small> / ${r.qs.length}</small></b></div>
        <div><span>Julienne</span><b>${score("j",s.ri)}<small> / ${r.qs.length}</small></b></div>
      </div>
      <p class="small">Running total: guests ${score("g")}, Julienne ${score("j")}</p>
    </div>`;
    acts=`<button class="btn solid" data-act="next">${last?"Who knows best?":"On to Round "+ROUNDS[s.ri+1].roman}</button>`;
  } else {
    const g=score("g"), j=score("j");
    const head = j>g ? "Julienne knows best" : g>j ? "The guests know best" : "A dead heat";
    where.textContent="The verdict";
    html=`<div class="screen">
      <div class="eyebrow">Who Knows Best?</div>
      <h2>${head}</h2>
      ${rule}
      <div class="versus big">
        <div class="${g>j?"win":""}"><span>The guests</span><b>${g}<small> / ${TOTAL}</small></b></div>
        <div class="${j>g?"win":""}"><span>Julienne</span><b>${j}<small> / ${TOTAL}</small></b></div>
      </div>
      <p class="lede">${verdict(j)}</p>
      <div class="breakdown">${ROUNDS.map((r,ri)=>`<div><span>Round ${r.roman}</span><b>${score("g",ri)} · ${score("j",ri)}</b><em>guests · Ju</em></div>`).join("")}</div>
    </div>`;
    acts=`<button class="btn" data-act="reset">Start over</button>`;
  }
  st.innerHTML=html; st.scrollTop=0;
  $("actions").innerHTML=acts;
  updateScore();

  const dots=$("dots");
  if(s.type==="q"){
    const r=ROUNDS[s.ri];
    dots.innerHTML=r.qs.map((_,qi)=>{
      const id=s.ri+"-"+qi, cls=[qi===s.qi?"now":"", S.revealed[id]?"got":""].join(" ");
      return `<button class="dot ${cls}" data-jump="${SLIDES.findIndex(x=>x.id===id)}" aria-label="Question ${qi+1}"><i></i></button>`;
    }).join("");
  } else dots.innerHTML="";

  $("prev").disabled = S.i===0;
  $("next").disabled = S.i===SLIDES.length-1;
  save();
}
function updateScore(){
  $("score").hidden = SLIDES[S.i].type==="title";
  $("scoreG").textContent=score("g");
  $("scoreJ").textContent=score("j");
}

function go(i){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();S.i=Math.max(0,Math.min(SLIDES.length-1,i));render()}
function reveal(){const s=SLIDES[S.i]; if(s.type==="q"&&!S.revealed[s.id]){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();S.revealed[s.id]=true;render()}}
function forward(){const s=SLIDES[S.i]; if(s.type==="q"&&!S.revealed[s.id]) reveal(); else go(S.i+1)}
function setSaid(t,v){const s=SLIDES[S.i]; (S.said[s.id]=S.said[s.id]||{})[t]=v; save()}
function setMark(t,v){
  const s=SLIDES[S.i], m=(S.mark[s.id]=S.mark[s.id]||{});
  if(result(s.id,t)===v){ delete m[t]; if(s.choice&&S.said[s.id]) S.said[s.id][t]=""; }  // tap again to clear
  else m[t]=v;
  render();
}

document.addEventListener("click",e=>{
  wake();
  const j=e.target.closest("[data-jump]"); if(j){$("navSheet").hidden=true;go(+j.dataset.jump);return}
  const p=e.target.closest("[data-pick]"); if(p){const s=SLIDES[S.i]; const cur=(S.said[s.id]||{})[p.dataset.pick]; setSaid(p.dataset.pick, cur===p.dataset.val?"":p.dataset.val); if(S.mark[s.id]) delete S.mark[s.id][p.dataset.pick]; render(); return}
  const m=e.target.closest("[data-mark]"); if(m){setMark(m.dataset.mark,m.dataset.val);return}
  const a=e.target.closest("[data-act]"); if(!a||!a.dataset.act)return;
  const act=a.dataset.act;
  if(act==="next")forward(); else if(act==="reveal")reveal();
  else if(act==="reset")$("sheet").hidden=false;
});
document.addEventListener("input",e=>{const t=e.target.closest("[data-said]"); if(t) setSaid(t.dataset.said,t.value)});
$("next").onclick=forward;
$("prev").onclick=()=>go(S.i-1);
$("resetBtn").onclick=()=>{$("sheet").hidden=false};
function openNav(){
  const cur=SLIDES[S.i];
  const items=[{label:"Back to start",note:"Title card",i:0,here:S.i===0}].concat(
    ROUNDS.map((r,ri)=>({label:"Round "+(ri+1),note:r.name,i:SLIDES.findIndex(s=>s.type==="round"&&s.ri===ri),here:cur.ri===ri})));
  $("navList").innerHTML=items.map(it=>`<button class="btn ${it.here?"here":""}" data-jump="${it.i}">${it.label}<span>${esc(it.note)}</span></button>`).join("");
  $("navSheet").hidden=false;
}
$("navBtn").onclick=openNav;
$("closeNav").onclick=()=>{$("navSheet").hidden=true};
$("navSheet").addEventListener("click",e=>{if(e.target.id==="navSheet")$("navSheet").hidden=true});
$("cancelReset").onclick=()=>{$("sheet").hidden=true};
$("confirmReset").onclick=()=>{S=fresh();$("sheet").hidden=true;render()};
document.addEventListener("keydown",e=>{
  if(!$("sheet").hidden||!$("navSheet").hidden){if(e.key==="Escape"){$("sheet").hidden=true;$("navSheet").hidden=true}return}
  if(e.target.matches&&e.target.matches("input")){ if(e.key==="Enter"||e.key==="Escape") e.target.blur(); return }
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();forward()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(S.i-1)}
});

// swipe: left = forward, right = back (not while typing)
let sx=null,sy=null;
$("stage").addEventListener("pointerdown",e=>{ if(e.target.closest("input,.pickbtn,.mk")){sx=null;return} sx=e.clientX;sy=e.clientY});
$("stage").addEventListener("pointerup",e=>{
  if(sx===null)return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){ dx<0?forward():go(S.i-1) }
});

let lock=null;
async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});

const root=document.documentElement;
const fsReq=root.requestFullscreen||root.webkitRequestFullscreen;
if(fsReq&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){
  $("fsBtn").hidden=false;
  $("fsBtn").onclick=()=>{
    const on=document.fullscreenElement||document.webkitFullscreenElement;
    try{ if(on)(document.exitFullscreen||document.webkitExitFullscreen).call(document); else {const p=fsReq.call(root); if(p&&p.catch)p.catch(()=>{});} }catch(e){}
  };
}

function start(data){load(data&&data.S);render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
